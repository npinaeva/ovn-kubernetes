apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: network1
spec:
  selectors:
    - cel:
        expression: device.driver == "k8s.ovn.org"
    - cel:
        expression: device.attributes["k8s.ovn.org"].?isSriovVf.orValue(false) == true
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: ovn-primary
  namespace: default
#  annotations:
#    k8s.ovn.org/deviceClass: network1
spec:
  config: '{ "cniVersion" : "0.4.0", "name" : "ovn-primary", "netAttachDefName":
    "default/ovn-primary", "type" : "ovn-k8s-cni-overlay" }'
---
apiVersion: v1
kind: Pod
metadata:
  name: pod1
spec:
  containers:
    - name: ctr1
      image: registry.k8s.io/e2e-test-images/agnhost:2.54
      securityContext:
        capabilities:
          add: [ "NET_ADMIN", "NET_RAW" ]
      command: ["/agnhost", "netexec"]
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: fake-claim-template
spec:
  spec:
    devices:
      requests:
        - name: "veth-request"
          exactly:
            deviceClassName: "network1"
---
apiVersion: v1
kind: Pod
metadata:
  name: pod2
spec:
  containers:
    - name: ctr1
      image: registry.k8s.io/e2e-test-images/agnhost:2.54
      securityContext:
        capabilities:
          add: [ "NET_ADMIN", "NET_RAW" ]
      command: ["/agnhost", "netexec"]
      resources:
        claims:
          - name: fake-claim
  resourceClaims:
    - name: fake-claim
      resourceClaimTemplateName: fake-claim-template