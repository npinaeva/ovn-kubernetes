kind: Namespace
apiVersion: v1
metadata:
  name: test
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: tenantblue
  namespace: test
  annotations:
    k8s.ovn.org/deviceClass: network1
spec:
  config: |2
    {
            "cniVersion": "1.0.0",
            "name": "tenant-blue",
            "type": "ovn-k8s-cni-overlay",
            "topology":"layer2",
            "subnets": "10.200.0.0/16",
            "netAttachDefName": "test/tenantblue",
            "role": "secondary"
    }
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: tenantred
  namespace: test
spec:
  config: |2
    {
            "cniVersion": "1.0.0",
            "name": "tenant-red",
            "type": "ovn-k8s-cni-overlay",
            "topology":"layer3",
            "subnets": "10.201.0.0/16/24",
            "netAttachDefName": "test/tenantred",
            "role": "secondary"
    }
---
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: network1
spec:
  selectors:
    - cel:
        expression: device.driver == "k8s.ovn.org"
    - cel:
        expression: device.attributes["k8s.ovn.org"].?isSriovVf.orValue(false) == true
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: fake-claim-template
  namespace: test
spec:
  spec:
    devices:
      requests:
        - name: "veth-request"
          exactly:
            deviceClassName: "network1"
            count: 2
---
apiVersion: v1
kind: Pod
metadata:
  name: pod1
  namespace: test
  labels:
    app: pod
  annotations:
    k8s.v1.cni.cncf.io/networks: "tenantblue, tenantblue, tenantblue, tenantred"
spec:
  containers:
  - name: ctr1
    image: registry.k8s.io/e2e-test-images/agnhost:2.54
    securityContext:
      capabilities:
        add: [ "NET_ADMIN", "NET_RAW" ]
    command: ["/agnhost", "netexec"]
    resources:
      claims:
        - name: fake-claim
  resourceClaims:
  - name: fake-claim
    resourceClaimTemplateName: fake-claim-template
---
apiVersion: v1
kind: Pod
metadata:
  name: pod2
  namespace: test
  labels:
    app: pod
  annotations:
    k8s.v1.cni.cncf.io/networks: "tenantblue, tenantblue, tenantred"
spec:
  containers:
    - name: ctr1
      image: registry.k8s.io/e2e-test-images/agnhost:2.54
      securityContext:
        capabilities:
          add: [ "NET_ADMIN", "NET_RAW" ]
      command: ["/agnhost", "netexec"]
      resources:
        claims:
          - name: fake-claim
  resourceClaims:
    - name: fake-claim
      resourceClaimTemplateName: fake-claim-template
---