kind: Namespace
apiVersion: v1
metadata:
  name: test-primary
  labels:
    k8s.ovn.org/primary-user-defined-network: "true"
---
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: network1
spec:
  selectors:
    - cel:
        expression: device.driver == "k8s.ovn.org"
    - cel:
        expression: device.attributes["k8s.ovn.org"].?isSriovVf.orValue(false) == true
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: fake-claim-template
  namespace: test-primary
spec:
  spec:
    devices:
      requests:
        - name: "veth-request"
          exactly:
            deviceClassName: "network1"
---
apiVersion: k8s.ovn.org/v1
kind: UserDefinedNetwork
metadata:
  name: db-network
  namespace: test-primary
  annotations:
    k8s.ovn.org/deviceClass: network1
spec:
  topology: Layer2
  layer2:
    role: Primary
    subnets:
      - "10.10.0.0/16"
---
apiVersion: v1
kind: Pod
metadata:
  name: pod1
  namespace: test-primary
  labels:
    app: pod
spec:
  containers:
  - name: ctr1
    image: registry.k8s.io/e2e-test-images/agnhost:2.54
    command: ["/agnhost", "netexec"]
---
apiVersion: v1
kind: Pod
metadata:
  name: pod2
  namespace: test-primary
spec:
  containers:
    - name: ctr1
      image: registry.k8s.io/e2e-test-images/agnhost:2.54
      securityContext:
        capabilities:
          add: [ "NET_ADMIN", "NET_RAW" ]
      command: ["/agnhost", "netexec"]
      resources:
        claims:
          - name: fake-claim
  resourceClaims:
    - name: fake-claim
      resourceClaimTemplateName: fake-claim-template