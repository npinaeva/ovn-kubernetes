kind: Namespace
apiVersion: v1
metadata:
  name: test
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: tenantblue
  namespace: test
  annotations:
    # put device class name here, it will create a claim template
    k8s.ovn.org/deviceClass: network1
spec:
  config: |2
    {
            "cniVersion": "1.0.0",
            "name": "tenant-blue",
            "type": "ovn-k8s-cni-overlay",
            "topology":"layer2",
            "subnets": "10.200.0.0/16",
            "netAttachDefName": "test/tenantblue",
            "role": "secondary"
    }
---
# defined by the admin once
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: network1
spec:
  selectors:
    - cel:
        expression: device.driver == "k8s.ovn.org"
    - cel:
        expression: device.attributes["k8s.ovn.org"].?isSriovVf.orValue(false) == true
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  # same name as nad, so same name that was used in the k8s.v1.cni.cncf.io/networks
  name: tenantblue
  namespace: test
  annotations:
    k8s.ovn.org/nad: tenantblue
spec:
  spec:
    devices:
      requests:
        - name: "tenantblue"
          exactly:
            deviceClassName: "network1"
---
apiVersion: v1
kind: Pod
metadata:
  name: pod1
  namespace: test
  labels:
    app: pod
  annotations:
    k8s.v1.cni.cncf.io/networks: "tenantred"
    # Or to avoid annotating the NAD
    k8s.ovn.org/networks: "tenantred:network1"
spec:
  containers:
  - name: ctr1
    image: registry.k8s.io/e2e-test-images/agnhost:2.54
    securityContext:
      capabilities:
        add: [ "NET_ADMIN", "NET_RAW" ]
    command: ["/agnhost", "netexec"]
    resources:
      # TODO this is another problem
      claims:
        - name: fake-claim
  # this one wants 2 devices from bluenetwork
  resourceClaims:
  - name: fake-claim1
    resourceClaimTemplateName: tenantblue
  - name: fake-claim2
    resourceClaimTemplateName: tenantblue
---
apiVersion: v1
kind: Pod
metadata:
  name: pod2
  namespace: test
  labels:
    app: pod
  annotations:
    k8s.v1.cni.cncf.io/networks: "tenantblue, tenantblue, tenantred"
spec:
  containers:
    - name: ctr1
      image: registry.k8s.io/e2e-test-images/agnhost:2.54
      securityContext:
        capabilities:
          add: [ "NET_ADMIN", "NET_RAW" ]
      command: ["/agnhost", "netexec"]
      resources:
        claims:
          - name: fake-claim
  resourceClaims:
    - name: fake-claim
      resourceClaimTemplateName: fake-claim-template

