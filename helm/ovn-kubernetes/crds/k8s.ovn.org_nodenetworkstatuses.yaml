---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: nodenetworkstatuses.k8s.ovn.org
spec:
  group: k8s.ovn.org
  names:
    kind: NodeNetworkStatus
    listKind: NodeNetworkStatusList
    plural: nodenetworkstatuses
    singular: nodenetworkstatus
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.nodeName
      name: Node
      type: string
    - jsonPath: .spec.networkName
      name: Network
      type: string
    - jsonPath: .spec.routeAdvertisements[*].vrf
      name: Advertised VRFs
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          NodeNetworkStatus reports the state of one network on one node. It is
          written by ovnkube-cluster-manager and read by the node that it names.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              networkName:
                description: NetworkName is the OVN network this state belongs to.
                maxLength: 253
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: networkName is immutable
                  rule: self == oldSelf
              nodeName:
                description: NodeName is the node this state belongs to.
                maxLength: 253
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: nodeName is immutable
                  rule: self == oldSelf
              routeAdvertisements:
                description: |-
                  RouteAdvertisements lists the RouteAdvertisements whose routes for this
                  network are published from this node. An entry is present only while
                  the corresponding FRR configuration exists, so the node can stop
                  translating pod traffic to its own address as soon as it sees one.
                items:
                  description: |-
                    NodeNetworkRouteAdvertisement is the contribution of one RouteAdvertisements
                    to a network on a node.
                  properties:
                    advertisements:
                      description: Advertisements lists what is advertised in that
                        VRF.
                      items:
                        description: AdvertisementType is a kind of route published
                          by a RouteAdvertisements.
                        enum:
                        - PodNetwork
                        - EgressIP
                        type: string
                      maxItems: 2
                      minItems: 1
                      type: array
                      x-kubernetes-list-type: set
                    name:
                      description: Name is the name of the RouteAdvertisements.
                      maxLength: 253
                      minLength: 1
                      type: string
                    vrf:
                      description: |-
                        VRF is the VRF the routes are advertised in. It is always resolved:
                        "default" for the default VRF, otherwise the VRF name, never "auto".
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                  - advertisements
                  - name
                  - vrf
                  type: object
                maxItems: 64
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
            required:
            - networkName
            - nodeName
            type: object
        required:
        - spec
        type: object
    selectableFields:
    - jsonPath: .spec.nodeName
    - jsonPath: .spec.networkName
    served: true
    storage: true
    subresources: {}
